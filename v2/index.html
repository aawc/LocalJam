<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="LocalJam v2 - Local audio player Progressive Web App" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LocalJam v2" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; media-src 'self' data: https: http: blob:; connect-src 'self' https: http:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';" />

  <title>LocalJam v2 - Local Audio Player</title>

  <base href="../" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./public/icons/icon-192.svg" />

  <link rel="stylesheet" href="./src/ui/theme.css" />
  <link rel="stylesheet" href="./src/ui/app.css" />
</head>
<body>
  <!-- Stage Mount (L0 Primary Viewport) -->
  <div id="stage-root"></div>

  <!-- Layer Mount (L1/L2 Modal & Sheet Stack) -->
  <div id="layer-root"></div>

  <!-- Toast Notification Mount -->
  <div id="toast-root"></div>

  <!-- Live Accessibility Region -->
  <div id="aria-live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Main JavaScript Module -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
