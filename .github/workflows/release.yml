name: Release on Commit

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate Release Metadata & Bundle
        id: meta
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MSG_SUBJECT=$(git log -1 --pretty=format:"%s")
          COMMIT_MSG_BODY=$(git log -1 --pretty=format:"%b")
          COMMIT_DATE=$(git log -1 --pretty=format:"%cd" --date=iso)

          # Dynamically generate timestamped semantic tag: v$yyyy.$mm.$nnn
          YYYY=$(date -u +%Y)
          MM=$(date -u +%m)
          NNN=$(printf "%03d" ${{ github.run_number }})
          TAG_NAME="v${YYYY}.${MM}.${NNN}"
          RELEASE_TITLE="LocalJam ${TAG_NAME}"

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          # Configure git author and push tag back to repository
          git config user.name "Varun Khaneja"
          git config user.email "git.bin@khaneja.org"
          git tag "${TAG_NAME}" "${COMMIT_SHA}"
          git push origin "${TAG_NAME}" --force

          # Create release notes
          {
            echo "## ${RELEASE_TITLE}"
            echo ""
            echo "### Live Deployment & App Access"
            echo "- 🌐 **Web App:** [https://varun.khaneja.org/LocalJam/](https://varun.khaneja.org/LocalJam/)"
            echo "- 🏷️ **Release Tag:** [${TAG_NAME}](https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME})"
            echo "- 📦 **Repository Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"
            echo ""
            echo "### Commit Details"
            echo "**Subject:** \`${COMMIT_MSG_SUBJECT}\`"
            echo "**Date:** \`${COMMIT_DATE}\`"
          } > release_notes.md

          if [ -n "$COMMIT_MSG_BODY" ]; then
            {
              echo ""
              echo "### Commit Message"
              printf '%s\n' "$COMMIT_MSG_BODY"
            } >> release_notes.md
          fi

          # Create a standalone offline distribution zip
          zip -r "LocalJam-${TAG_NAME}.zip" . -x "*.git*" "node_modules/*" ".github/*" "test/*"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag_name }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file release_notes.md \
            "LocalJam-${{ steps.meta.outputs.tag_name }}.zip"
