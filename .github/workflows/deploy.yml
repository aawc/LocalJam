name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Deployment Version Metadata
        run: |
          YYYY=$(date -u +%Y)
          MM=$(date -u +%m)
          NNN=$(printf "%03d" ${{ github.run_number }})
          TAG_NAME="v${YYYY}.${MM}.${NNN}"
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          node -e "
            const cp = require('child_process');
            const fs = require('fs');

            const tagName = '${TAG_NAME}';
            const releaseDate = '${RELEASE_DATE}';

            let commits = [];
            try {
              const raw = cp.execSync('git log -n 15 --pretty=format:%h%x09%s').toString().trim();
              commits = raw.split('\n').filter(Boolean).map(line => {
                const [hash, ...rest] = line.split('\t');
                return { hash: (hash || '').trim(), message: rest.join('\t').trim() };
              });
            } catch (e) {
              commits = [{ hash: '${SHORT_SHA}', message: 'Deployment update' }];
            }

            const payload = {
              version: tagName,
              releaseDate: releaseDate,
              title: 'LocalJam ' + tagName,
              commits: commits,
              notes: [
                'Fixed SomaFM (Illinois Street Lounge, Secret Agent, Lush, Space Station, Deep Space One, Suburbs of Goa) and BBC Radio 6 stream endpoints.',
                'Categorized radio stations into 10 high-level genre sections with clean navigation and search filtering.',
                'Added fullscreen display mode with keyboard shortcut (F) and canvas double-click to Audio Visualizer.',
                'Streamlined application footer and refined user interface copy across all views.',
                'Continuous automated release detection and one-click refresh notification.'
              ]
            };

            fs.writeFileSync('version.json', JSON.stringify(payload, null, 2));

            // Synchronize src/version.js with deployment version
            if (fs.existsSync('src/version.js')) {
              let versionJs = fs.readFileSync('src/version.js', 'utf8');
              versionJs = versionJs.replace(/export const APP_VERSION = [^;]+;/, 'export const APP_VERSION = "' + tagName + '";');
              versionJs = versionJs.replace(/version:\s*["'][^"']+["']/, 'version: "' + tagName + '"');
              versionJs = versionJs.replace(/releaseDate:\s*["'][^"']+["']/, 'releaseDate: "' + releaseDate + '"');
              versionJs = versionJs.replace(/title:\s*["'][^"']+["']/, 'title: "LocalJam ' + tagName + '"');
              fs.writeFileSync('src/version.js', versionJs);
            }

            // Synchronize sw.js CACHE_NAME with deployment version
            if (fs.existsSync('sw.js')) {
              let swJs = fs.readFileSync('sw.js', 'utf8');
              swJs = swJs.replace(/const CACHE_NAME = [^;]+;/, "const CACHE_NAME = 'localjam-" + tagName + "';");
              fs.writeFileSync('sw.js', swJs);
            }
          "

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
