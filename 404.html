<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=./" />
  <title>LocalJam</title>
  <script>
    const path = window.location.pathname;
    if (path.includes('/v2')) {
      window.location.replace(window.location.origin + path.replace(/\/v2(?:\/(.*))?$/, '/$1') + (window.location.hash || ''));
    } else {
      window.location.replace('./' + (window.location.hash || ''));
    }
  </script>
</head>
<body>
  <p>Redirecting to <a href="./">LocalJam</a>...</p>
</body>
</html>
