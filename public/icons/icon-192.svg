<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="icon-grad-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0072B2"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow-192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shell -->
  <rect width="192" height="192" rx="44" fill="#0b0f17"/>
  <rect x="6" y="6" width="180" height="180" rx="38" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Outer Vinyl Groove / Ring -->
  <circle cx="96" cy="96" r="68" fill="none" stroke="url(#icon-grad-192)" stroke-width="6" filter="url(#glow-192)"/>
  <circle cx="96" cy="96" r="50" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="96" cy="96" r="32" fill="none" stroke="#1e293b" stroke-width="3"/>
  
  <!-- Center Core & Play Triangle -->
  <circle cx="96" cy="96" r="20" fill="#fbbf24"/>
  <polygon points="90,82 110,96 90,110" fill="#0b0f17"/>
</svg>
